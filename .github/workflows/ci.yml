name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Weekly audit cron (see `10` §3, `11` §6).
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # `testing` feature exposes MockStore/MockBackend for integration tests;
      # the default `cargo test` skips `#[ignore]` real-keyring/git tests.
      - name: cargo test (skip ignored)
        run: cargo test --features testing --verbose
      # Verify both binaries are produced and avpm-client speaks the
      # Ansible vault-password-client protocol (exit 2 on unknown vault-id,
      # matching VAULT_ID_UNKNOWN_RC).
      - name: Verify dual binaries + avpm-client protocol
        run: |
          cargo build --release
          test -x target/release/avpm
          test -x target/release/avpm-client
          # Unknown vault-id must exit 2 (Ansible contract).
          target/release/avpm-client --vault-id __ci_missing__; [ $? -eq 2 ] || [ $? -eq 5 ]

  lint:
    name: "Lint (prek: fmt + clippy + deny + builtins)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # prek's local hooks invoke `cargo deny` directly; install the binary so
      # the check group runs here alongside the lint group's clippy/fmt.
      - uses: taiki-e/install-action@cargo-deny
      - uses: astral-sh/setup-uv@v4
      # Single source of truth: every fmt/lint/check rule lives in prek.toml.
      # CI just installs the toolchains prek's hooks call and runs the same
      # `prek run --all-files` developers run locally. No parallel definition.
      - name: Validate prek config
        run: uvx prek validate-config prek.toml
      - name: prek run --all-files (fmt + lint + lock-fresh + builtins)
        # pre-commit stage: everything a contributor can fix locally. Mutating
        # fmt hooks make prek exit non-zero if any file needed reformatting.
        run: uvx prek run --all-files
      - name: prek run --hook-stage manual (cargo deny supply-chain)
        # manual stage: cargo deny (advisories/licenses/bans/sources). Kept out
        # of local pre-commit so transitive advisories (e.g. ratatui -> paste)
        # cannot block a contributor's commits; CI still enforces it.
        run: uvx prek run --hook-stage manual --all-files

  audit:
    name: Supply-chain (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `cargo deny check` lives in prek.toml and runs in the lint job's
      # `prek run --all-files`. This job keeps only cargo audit, which queries
      # the RustSec advisory DB and needs network at run time — too slow for
      # every local commit, so it stays a CI-only gate.
      - uses: taiki-e/install-action@cargo-audit
      - name: cargo audit
        run: cargo audit

  ignored-tests:
    name: Real-system tests (keyring + git)
    runs-on: ubuntu-latest
    # Manual / nightly only — needs a D-Bus session and an unlocked keyring.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start D-Bus / GNOME Keyring session
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring dbus-x11
          eval $(dbus-launch --sh-syntax)
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> $GITHUB_ENV
          echo "DISPLAY=$DISPLAY" >> $GITHUB_ENV
          # Unlock the default keyring with a blank password so Secret Service works.
          gnome-keyring-daemon --start --components=secrets --unlock < /dev/null || true
      # Full suite: with a live Secret Service daemon the session-collection
      # integration tests and the binary-level acceptance tests (which
      # runtime-skip in the daemon-less main job) really execute here.
      - name: cargo test (full suite with live daemon)
        run: cargo test --features testing --nocapture
      - name: cargo test --ignored (legacy real-keyring)
        run: cargo test --features testing -- --ignored --nocapture
