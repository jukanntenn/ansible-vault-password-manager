# cargo-deny configuration for supply-chain security.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Lint the full dependency graph as resolved in Cargo.lock.
all-features = true

[advisories]
# Fail the build on any advisory with a known fix available.
version = 2
db-path = "~/.cargo/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
# Allow permissive licenses used by the dependency tree.
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
# Flag duplicate versions of the same crate (informational; not fatal here to
# allow the wide tokio/reqwest/ratatui ecosystem to coexist).
multiple-versions = "warn"
wildcards = "allow"

[sources]
# Disallow crates not on crates.io.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
