[package]
name = "avpm"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Ansible Vault Password Manager - a minimal system keyring adapter with end-to-end encrypted sync"
license = "MIT"
authors = ["avpm contributors"]
repository = "https://github.com/jukanntenn/ansible-vault-password-manager"
readme = "README.md"
keywords = ["ansible", "vault", "password", "keyring", "cli"]
categories = ["command-line-utilities", "cryptography"]
# Single integration test binary (ripgrep-style): every file under `tests/` is
# a module declared by `tests/main.rs`, so the whole suite compiles once and
# shares `tests/common/mod.rs`. `autotests = false` disables cargo's default of
# treating each `tests/*.rs` as a separate test binary.
autotests = false

[[bin]]
name = "avpm"
path = "src/main.rs"

# Ansible vault password client entry point. Ansible only passes `--vault-id`
# to scripts whose file name ends in `-client` (script_is_client detection),
# so a second binary with that name is required for the vault-password-client
# protocol. It shares the exact same implementation as `avpm`.
[[bin]]
name = "avpm-client"
path = "src/bin/client.rs"

[[test]]
name = "integration"
path = "tests/main.rs"

[lib]
name = "avpm"
path = "src/lib.rs"

[dependencies]
# === CLI parsing ===
clap = { version = "4.5", features = ["derive"] }

# === Config loading ===
config = { version = "0.15", default-features = false, features = ["toml"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# === System keyring ===
keyring = { version = "4", features = ["v1"] }
# Direct access to the Secret Service session collection (master-passphrase
# cache). Both crates are already in the dependency tree via `keyring`;
# declaring them directly lets master.rs use their types. `rt-async-io-crypto-rust`
# is required: on macOS nothing else enables a zbus runtime feature (keyring's
# zbus store is Linux-only) and zbus fails to compile without "async-io" or
# "tokio". The async-io runtime also avoids tokio-nested-runtime panics in the
# blocking Secret Service calls.
secret-service = { version = "5", features = ["rt-async-io-crypto-rust"] }
zvariant = "5"

# === Encrypted sync (age) ===
age = { version = "0.12", features = ["armor"] }

# === WebDAV backend ===
# reqwest is shared with reqwest_dav (0.2.2 pins reqwest ^0.12, so no version
# bump). The "form" feature is added by reqwest_dav; rustls-tls stays our TLS.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Community WebDAV client (1M+ downloads, used by OpenTalk). Replaces the
# hand-rolled HEAD/PUT/GET + base64 Basic-auth code. Conditional PUTs (If-Match
# / If-None-Match) are done via the public `start_request` escape hatch, which
# returns a raw reqwest::RequestBuilder we attach headers to.
#
# `default-features = false`: reqwest_dav's default pulls `reqwest/default`
# (native-tls → openssl-sys), which re-enables native-tls on the shared `reqwest`
# via feature unification even though avpm configures reqwest rustls-only below.
# That makes the build require pkg-config/libssl-dev for no functional gain.
# Pin the rustls/webpki-roots feature to match avpm's reqwest config ("rustls-tls
# stays our TLS") so WebDAV uses the same rustls TLS as everything else.
reqwest_dav = { version = "0.2.2", default-features = false, features = ["rustls-tls-webpki-roots"] }

# === TUI ===
# ratatui 0.30 dropped the unmaintained `paste` proc-macro dependency
# (RUSTSEC-2024-0436). Form input is an in-tree single-line widget
# (`src/tui/input.rs`); tui-textarea was removed because its latest release
# (0.7) only supports ratatui 0.29. crossterm 0.28 is the backend version
# ratatui 0.30 pairs with.
ratatui = "0.30"
crossterm = "0.28"
arboard = "3"

# === Async runtime ===
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }

# === Logging (high observability) ===
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# === Error handling ===
thiserror = "2"
anyhow = "1"

# === Utilities ===
dirs = "6"
rpassword = "7"
zeroize = "1"
jiff = { version = "0.2", features = ["serde"] }
rand = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
trycmd = "0.15"
proptest = "1"
# For binary-level acceptance tests: seed/clean the real Secret Service
# session collection exactly like `avpm unlock` does (same versions as the
# normal dependencies, zero new downloads).
secret-service = { version = "5", features = ["rt-async-io-crypto-rust"] }
zvariant = "5"

# For TUI integration tests (tests/tui/): drive `avpm tui` under a pty and
# assert on the rendered output.
# portable-pty (wezterm): cross-platform pty spawn, used instead of the
# Linux-only `script` wrapper so TUI tests also run on macOS.
# (A terminal-emulator crate was considered — vt100 — but it requires
# unicode-width ^0.2.1 while ratatui 0.30 pins =0.2.0 exactly, an
# irreconcilable conflict. vte, a conflict-free parser, remains a future
# option if a test needs positional screen precision.)
portable-pty = "0.9"

# WebDAV mock server for backend e2e tests. Chosen over wiremock (half-dead,
# ~1y stale) and mockito (no standalone mode) for its standalone server + Docker
# image, which enables future cross-process/Docker e2e tests.
httpmock = "0.8"

[features]
default = []
# Exposes MockStore / MockBackend for integration tests in `tests/`. The binary
# does not enable this; it's a dev-only affordance.
testing = []
